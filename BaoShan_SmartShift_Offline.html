<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="宝山园区人力计划、排班与跨项目调配演示平台">
  <title>宝山园区人力协同调度台｜离线版</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c2d48'/%3E%3Cpath d='M15 43V21h9v22zm13 0V13h9v30zm13 0V27h9v16z' fill='%2300a6c8'/%3E%3C/svg%3E">
  <style>
:root {
  --navy-950: #071b2c;
  --navy-900: #0a263d;
  --navy-800: #0e3654;
  --blue-700: #006b8f;
  --cyan-600: #008fb3;
  --cyan-500: #00a6c8;
  --cyan-100: #ddf6fb;
  --ink: #10283d;
  --muted: #607487;
  --line: #dce6ec;
  --line-soft: #eaf0f4;
  --panel: #ffffff;
  --canvas: #f3f7f9;
  --orange: #e97823;
  --orange-soft: #fff1e7;
  --red: #d94452;
  --red-soft: #ffeaed;
  --green: #0b8a68;
  --green-soft: #e2f6ef;
  --amber: #b86a00;
  --amber-soft: #fff3d8;
  --shadow: 0 12px 30px rgba(8, 38, 61, 0.08);
  --radius-lg: 18px;
  --radius-md: 13px;
  --radius-sm: 9px;
}

* { box-sizing: border-box; }

html { min-width: 320px; background: var(--canvas); }

body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

button, input, select { font: inherit; }
button { color: inherit; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  color: #d8e8f1;
  background:
    radial-gradient(circle at 24px 48px, rgba(0, 166, 200, .18), transparent 170px),
    linear-gradient(180deg, var(--navy-900), var(--navy-950));
}

.brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 28px; }
.brand strong { display: block; color: #fff; font-size: 1.08rem; letter-spacing: .01em; }
.brand small { display: block; margin-top: 2px; color: #8fb1c4; font-size: .76rem; letter-spacing: .12em; }
.brand-mark { width: 34px; height: 34px; display: flex; align-items: end; gap: 3px; padding: 7px; border-radius: 11px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
.brand-mark span { flex: 1; border-radius: 2px 2px 0 0; background: var(--cyan-500); }
.brand-mark span:nth-child(1) { height: 52%; }
.brand-mark span:nth-child(2) { height: 100%; }
.brand-mark span:nth-child(3) { height: 70%; }

#mainNav { display: grid; gap: 5px; }
.nav-button {
  width: 100%;
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: center;
  gap: 10px;
  min-height: 47px;
  padding: 8px 11px;
  border: 0;
  border-radius: 11px;
  color: #aac3d1;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.nav-button:hover { color: #fff; background: rgba(255,255,255,.065); }
.nav-button:focus-visible { outline: 2px solid #6fe2f5; outline-offset: 2px; }
.nav-button.active { color: #fff; background: linear-gradient(100deg, rgba(0,166,200,.26), rgba(0,166,200,.08)); box-shadow: inset 3px 0 var(--cyan-500); }
.nav-index { font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: #6f95a9; }
.nav-button.active .nav-index { color: #56d3e8; }
.nav-label { font-size: .91rem; font-weight: 650; }
.nav-badge { min-width: 22px; padding: 2px 6px; border-radius: 999px; color: #fff; background: var(--orange); font-size: .7rem; font-weight: 700; text-align: center; }

.sidebar-note { margin-top: auto; padding: 15px; border: 1px solid rgba(255,255,255,.09); border-radius: 13px; background: rgba(255,255,255,.045); }
.sidebar-note small { color: #86a9bb; }
.sidebar-note strong { display: block; margin: 4px 0 9px; color: #fff; font-size: .88rem; }
.role-row { display: flex; flex-wrap: wrap; gap: 5px; }
.role-row span { padding: 3px 7px; border-radius: 999px; color: #b8d2df; background: rgba(255,255,255,.08); font-size: .68rem; font-weight: 700; }

.workspace { min-width: 0; }
.topbar { height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 32px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.93); backdrop-filter: blur(12px); }
.topbar h1 { margin: 1px 0 0; color: var(--ink); font-size: clamp(1.22rem, 1.7vw, 1.6rem); line-height: 1.2; }
.eyebrow { margin: 0; color: var(--cyan-600); font-size: .74rem; font-weight: 800; letter-spacing: .13em; }
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.live-pill { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .82rem; font-weight: 650; }
.live-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
.avatar { width: 38px; height: 38px; border: 0; border-radius: 12px; color: #fff; background: var(--navy-800); font-size: .78rem; font-weight: 800; cursor: default; }

#app { width: min(1580px, 100%); margin: 0 auto; padding: 26px 32px 44px; }
.view { animation: enter .24s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.context-bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
.context-copy h2 { margin: 0 0 3px; font-size: 1.12rem; }
.context-copy p { margin: 0; color: var(--muted); font-size: .86rem; }
.context-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
.control, .button {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.control { padding: 0 12px; color: var(--ink); font-size: .86rem; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; font-size: .86rem; font-weight: 700; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
.button:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(10,38,61,.08); }
.button:active { transform: translateY(0); }
.button:focus-visible, .control:focus-visible, input:focus-visible { outline: 3px solid rgba(0,166,200,.22); outline-offset: 1px; border-color: var(--cyan-500); }
.button.primary { border-color: var(--cyan-600); color: #fff; background: var(--cyan-600); }
.button.primary:hover { background: #007e9e; }
.button.dark { border-color: var(--navy-800); color: #fff; background: var(--navy-800); }
.button.ghost { color: var(--muted); background: transparent; }
.button.small { min-height: 34px; padding: 0 10px; font-size: .78rem; }
.button:disabled { opacity: .46; cursor: not-allowed; transform: none; box-shadow: none; }

.segmented { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
.segment { min-height: 32px; padding: 0 11px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: .78rem; font-weight: 700; cursor: pointer; }
.segment.active { color: var(--ink); background: #e9f5f8; box-shadow: 0 1px 3px rgba(8,38,61,.08); }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi-card { position: relative; overflow: hidden; min-height: 124px; padding: 19px; border: 1px solid var(--line-soft); border-radius: var(--radius-md); background: var(--panel); box-shadow: 0 5px 20px rgba(8,38,61,.045); }
.kpi-card::after { content: ""; position: absolute; right: -20px; top: -24px; width: 80px; height: 80px; border-radius: 50%; background: rgba(0,166,200,.055); }
.kpi-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .79rem; font-weight: 700; }
.kpi-label .mini-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; color: var(--cyan-600); background: var(--cyan-100); font-size: .74rem; }
.kpi-value { margin-top: 12px; font-size: clamp(1.62rem, 2.6vw, 2.15rem); font-weight: 780; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.kpi-value small { margin-left: 5px; font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: 0; }
.kpi-foot { margin-top: 9px; color: var(--muted); font-size: .76rem; }
.kpi-foot strong { color: var(--green); }
.kpi-foot .warn { color: var(--red); }
.kpi-card.alert { border-color: #ffd8bd; }
.kpi-card.alert::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--orange); }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(310px, .75fr); gap: 16px; align-items: stretch; }
.panel { min-width: 0; border: 1px solid var(--line-soft); border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow); }
.panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 19px 20px 14px; border-bottom: 1px solid var(--line-soft); }
.panel-header h3 { margin: 0; font-size: 1rem; }
.panel-header p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; }
.panel-body { padding: 18px 20px; }
.panel-footer { padding: 13px 20px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: .76rem; }

.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: .82rem; white-space: nowrap; }
.data-table th { padding: 10px 12px; color: #758797; background: #f7fafb; border-bottom: 1px solid var(--line); font-size: .72rem; font-weight: 750; text-align: right; letter-spacing: .03em; }
.data-table th:first-child, .data-table td:first-child { text-align: left; }
.data-table td { padding: 14px 12px; border-bottom: 1px solid var(--line-soft); text-align: right; font-variant-numeric: tabular-nums; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #fbfdfe; }
.project-cell { display: flex; align-items: center; gap: 10px; }
.project-code { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--blue-700); background: #e6f5f8; font-size: .74rem; font-weight: 800; }
.project-name strong { display: block; font-size: .83rem; }
.project-name small { color: var(--muted); font-size: .7rem; }
.source-badge, .status-badge { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 4px 8px; border-radius: 999px; font-size: .69rem; font-weight: 750; }
.source-badge.customer { color: #05654f; background: var(--green-soft); }
.source-badge.model { color: #775000; background: var(--amber-soft); }
.status-badge.shortage { color: var(--red); background: var(--red-soft); }
.status-badge.surplus { color: var(--green); background: var(--green-soft); }
.status-badge.model { color: #775000; background: var(--amber-soft); }
.status-badge.balanced { color: #3f6879; background: #eaf2f5; }
.number-strong { font-weight: 800; color: var(--ink); }
.number-short { color: var(--red); font-weight: 800; }
.number-surplus { color: var(--green); font-weight: 800; }

.recommendation-panel { overflow: hidden; background: linear-gradient(180deg, #0d3552, #08263d); color: #fff; }
.recommendation-panel .panel-header { border-color: rgba(255,255,255,.1); }
.recommendation-panel .panel-header p { color: #9ec0d1; }
.reco-summary { padding: 17px 20px 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.reco-stat { padding: 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 11px; background: rgba(255,255,255,.055); }
.reco-stat small { display: block; color: #94b7c9; font-size: .68rem; }
.reco-stat strong { display: block; margin-top: 5px; font-size: 1.23rem; font-variant-numeric: tabular-nums; }
.reco-list { display: grid; gap: 10px; padding: 14px 20px 18px; }
.reco-item { position: relative; padding: 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; background: rgba(255,255,255,.06); }
.reco-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.reco-node { display: inline-flex; align-items: center; gap: 6px; font-size: .77rem; font-weight: 750; }
.reco-node b { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,.1); }
.reco-arrow { flex: 1; height: 1px; position: relative; background: rgba(93,221,241,.44); }
.reco-arrow::after { content: ""; position: absolute; right: 0; top: -3px; border-left: 5px solid #5dddf1; border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
.reco-item p { margin: 0; color: #b4ceda; font-size: .72rem; }
.reco-item strong { color: #67e1f4; }
.reco-empty { padding: 34px 16px; text-align: center; color: #bad1dc; }
.reco-empty b { display: block; margin-bottom: 6px; color: #fff; }
.reco-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 20px 20px; }
.recommendation-panel .button.primary { border-color: #45cbe2; background: #45cbe2; color: #062238; }
.recommendation-panel .button.ghost { border-color: rgba(255,255,255,.14); color: #bad3de; }

.lower-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; margin-top: 16px; }
.flow-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.flow-step { position: relative; min-height: 89px; padding: 14px; border: 1px solid var(--line-soft); border-radius: 12px; background: #fbfdfe; }
.flow-step:not(:last-child)::after { content: "›"; position: absolute; z-index: 1; right: -8px; top: 31px; width: 16px; height: 24px; display: grid; place-items: center; color: var(--cyan-600); background: #fff; font-size: 1.3rem; }
.flow-step span { display: block; color: var(--cyan-600); font-size: .67rem; font-weight: 800; letter-spacing: .08em; }
.flow-step strong { display: block; margin-top: 5px; font-size: .8rem; }
.flow-step small { display: block; margin-top: 4px; color: var(--muted); font-size: .68rem; }
.data-health { display: grid; gap: 10px; }
.health-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; }
.health-row span { color: var(--muted); font-size: .76rem; }
.health-row strong { font-size: .78rem; }
.progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: #edf2f5; }
.progress-track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan-600), #3acbdc); }

.notice { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid #f3d7a5; border-radius: 12px; background: #fff9ec; color: #70501a; font-size: .81rem; }
.notice-icon { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 9px; background: #ffedc8; font-weight: 800; }
.notice strong { display: block; margin-bottom: 2px; color: #65450f; }

.forecast-layout, .data-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .55fr); gap: 16px; }
.mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.mini-card { padding: 15px 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: #fff; }
.mini-card small { display: block; color: var(--muted); font-size: .72rem; }
.mini-card strong { display: block; margin-top: 5px; font-size: 1.3rem; }
.mini-card span { color: var(--green); font-size: .7rem; font-weight: 700; }
.sparkline { width: 108px; height: 34px; vertical-align: middle; }
.sparkline path.area { fill: rgba(0,166,200,.1); }
.sparkline path.line { fill: none; stroke: var(--cyan-600); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.forecast-input { width: 88px; min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; text-align: right; color: var(--ink); background: #fff; }
.forecast-input:disabled { color: #8b9ca8; background: #f3f6f7; }
.formula-card { padding: 18px; border-radius: 14px; color: #fff; background: linear-gradient(145deg, var(--navy-800), var(--navy-950)); }
.formula-card h3 { margin: 0 0 14px; font-size: .94rem; }
.formula { padding: 14px; border: 1px solid rgba(255,255,255,.11); border-radius: 11px; background: rgba(255,255,255,.06); font-size: .82rem; line-height: 1.8; }
.formula b { color: #62dced; }
.formula-card ul { margin: 14px 0 0; padding-left: 19px; color: #b4ccda; font-size: .75rem; }
.formula-card li + li { margin-top: 7px; }
.formula-card .button { width: 100%; margin-top: 16px; }

.schedule-input { display: inline-grid; grid-template-columns: 30px 50px 30px; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
.schedule-input button { height: 34px; border: 0; color: var(--cyan-600); background: #f2f8fa; font-size: 1rem; font-weight: 800; cursor: pointer; }
.schedule-input input { width: 50px; height: 34px; padding: 0; border: 0; text-align: center; font-weight: 750; background: #fff; -moz-appearance: textfield; }
.schedule-input input::-webkit-inner-spin-button { display: none; }
.formula-mini { color: var(--muted); font-size: .69rem; }
.formula-mini b { color: var(--ink); }
.shift-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.shift-card { padding: 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: #fbfdfe; }
.shift-card-head { display: flex; justify-content: space-between; gap: 8px; }
.shift-card-head strong { font-size: .82rem; }
.shift-card-head span { color: var(--muted); font-size: .7rem; }
.shift-card .bar-row { margin-top: 12px; }
.bar-label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; color: var(--muted); font-size: .7rem; }

.reco-page-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(310px, .75fr); gap: 16px; }
.transfer-card { display: grid; grid-template-columns: minmax(120px, 1fr) 74px minmax(120px, 1fr) auto; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--line-soft); border-radius: 13px; background: #fff; }
.transfer-card + .transfer-card { margin-top: 10px; }
.transfer-side { padding: 11px 12px; border-radius: 10px; background: #f4f8fa; }
.transfer-side small { display: block; color: var(--muted); font-size: .68rem; }
.transfer-side strong { font-size: .86rem; }
.transfer-arrow-big { position: relative; height: 2px; background: var(--cyan-500); }
.transfer-arrow-big::after { content: ""; position: absolute; right: -1px; top: -5px; border-left: 8px solid var(--cyan-500); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.transfer-count { text-align: center; color: var(--cyan-600); font-size: .78rem; font-weight: 800; }
.comparison { display: grid; gap: 12px; }
.compare-row { padding: 15px; border: 1px solid var(--line-soft); border-radius: 12px; background: #fbfdfe; }
.compare-row-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: .76rem; }
.compare-row-head strong { font-size: .88rem; }
.compare-bars { display: grid; gap: 7px; }
.compare-bar { display: grid; grid-template-columns: 40px 1fr 42px; align-items: center; gap: 8px; color: var(--muted); font-size: .67rem; }
.compare-bar i { height: 8px; border-radius: 999px; background: #dbe7ec; }
.compare-bar.after i { background: linear-gradient(90deg, var(--cyan-600), #3acbdc); }

.history-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(290px, .6fr); gap: 16px; }
.chart-legend { display: flex; gap: 14px; color: var(--muted); font-size: .69rem; }
.chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
.chart-legend i { width: 9px; height: 9px; border-radius: 3px; background: #c6d5dd; }
.chart-legend span:last-child i { background: var(--cyan-500); }
.bar-chart { height: 245px; display: grid; grid-template-columns: repeat(14, 1fr); align-items: end; gap: 8px; padding: 16px 0 2px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(to top, transparent 0, transparent 48px, #edf2f4 49px); }
.bar-group { height: 100%; display: flex; align-items: end; justify-content: center; gap: 2px; position: relative; }
.bar-group i { width: 37%; min-width: 5px; max-width: 14px; border-radius: 4px 4px 0 0; background: #cbd8df; transition: height .3s ease; }
.bar-group i.actual { background: var(--cyan-500); }
.bar-group small { position: absolute; bottom: -22px; color: #82939f; font-size: .61rem; }
.review-list { display: grid; gap: 9px; }
.review-item { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line-soft); border-radius: 11px; background: #fbfdfe; }
.review-date { color: var(--muted); font-size: .68rem; }
.review-item strong { display: block; font-size: .78rem; }
.review-item small { color: var(--muted); font-size: .68rem; }

.source-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.source-card { padding: 17px; border: 1px solid var(--line-soft); border-radius: 13px; background: #fff; }
.source-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>

        <div class="topbar-actions"><span class="live-pill"><i></i> 数据已更新</span><button class="avatar" aria-label="当前用户 Mike Lei">ML</button></div>
      </header>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script>
const DEFAULT_PROJECTS = [
  { id: "A", name: "项目 A", process: "B2B 出库", customerForecast: 6850, systemForecast: 6710, efficiency: 16.5, hours: 8, buffer: 1.08, scheduled: 50, history: [6100, 6420, 6300, 6550, 6700, 6640, 6750] },
  { id: "B", name: "项目 B", process: "B2C 出库", customerForecast: 9280, systemForecast: 9450, efficiency: 22.5, hours: 8, buffer: 1.08, scheduled: 52, history: [8840, 9010, 9190, 9250, 9380, 9470, 9480] },
  { id: "C", name: "项目 C", process: "退货质检", customerForecast: null, systemForecast: 3120, efficiency: 9.8, hours: 8, buffer: 1.08, scheduled: 47, history: [2760, 2890, 2980, 3010, 3060, 3150, 3090] },
  { id: "D", name: "项目 D", process: "增值服务", customerForecast: null, systemForecast: 2080, efficiency: 7.6, hours: 8, buffer: 1.08, scheduled: 44, history: [1810, 1900, 1990, 2050, 2140, 2070, 2090] },
  { id: "E", name: "项目 E", process: "入库上架", customerForecast: 5730, systemForecast: 5510, efficiency: 15.0, hours: 8, buffer: 1.08, scheduled: 50, history: [5200, 5310, 5420, 5480, 5500, 5520, 5500] }
];

const NAV_ITEMS = [
  { id: "overview", label: "调度总览", title: "今日调度总览" },
  { id: "forecast", label: "货量与预测", title: "货量预测中心" },
  { id: "schedule", label: "人力排班", title: "人力计划与排班" },
  { id: "recommendations", label: "调配建议", title: "园区资源调配建议" },
  { id: "history", label: "历史复盘", title: "历史绩效复盘" },
  { id: "data", label: "数据中心", title: "数据接入与质量" }
];

const stored = (() => {
  try { return JSON.parse(localStorage.getItem("baoshan-smartshift-state")); }
  catch (_) { return null; }
})();

const state = {
  activeView: "overview",
  planDate: stored?.planDate || "2026-09-22",
  shift: stored?.shift || "all",
  projects: stored?.projects || structuredClone(DEFAULT_PROJECTS),
  lastUpdated: stored?.lastUpdated || "09:18",
  generated: true,
  sourceUpdates: stored?.sourceUpdates || { customer: "今日 08:40", lms: "今日 09:05", roster: "今日 09:12" }
};

const app = document.getElementById("app");
const nav = document.getElementById("mainNav");
const title = document.getElementById("pageTitle");
const toastEl = document.getElementById("toast");
let toastTimer;

function saveState() {
  try {
    localStorage.setItem("baoshan-smartshift-state", JSON.stringify({
      planDate: state.planDate,
      shift: state.shift,
      projects: state.projects,
      lastUpdated: state.lastUpdated,
      sourceUpdates: state.sourceUpdates
    }));
  } catch (_) {}
}

function fmt(value, digits = 0) {
  return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: digits }).format(value);
}

function planVolume(project) {
  return project.customerForecast ?? project.systemForecast;
}

function demand(project) {
  return Math.ceil((planVolume(project) / (project.efficiency * project.hours)) * project.buffer);
}

function balance(project) {
  return project.scheduled - demand(project);
}

function metrics() {
  const totalVolume = state.projects.reduce((sum, p) => sum + planVolume(p), 0);
  const totalDemand = state.projects.reduce((sum, p) => sum + demand(p), 0);
  const totalScheduled = state.projects.reduce((sum, p) => sum + p.scheduled, 0);
  const shortage = state.projects.reduce((sum, p) => sum + Math.max(0, -balance(p)), 0);
  const surplus = state.projects.reduce((sum, p) => sum + Math.max(0, balance(p)), 0);
  const residual = Math.max(0, shortage - surplus);
  const overtime = shortage * 8;
  const optimizedOvertime = residual * 8;
  return { totalVolume, totalDemand, totalScheduled, shortage, surplus, residual, overtime, optimizedOvertime };
}

function getRecommendations() {
  const donors = state.projects
    .filter(p => balance(p) > 0)
    .map(p => ({ id: p.id, name: p.name, process: p.process, available: balance(p) }));
  const receivers = state.projects
    .filter(p => balance(p) < 0)
    .map(p => ({ id: p.id, name: p.name, process: p.process, need: -balance(p) }));
  const result = [];
  let donorIndex = 0;
  let receiverIndex = 0;
  while (donorIndex < donors.length && receiverIndex < receivers.length) {
    const donor = donors[donorIndex];
    const receiver = receivers[receiverIndex];
    const count = Math.min(donor.available, receiver.need);
    result.push({ from: donor.id, fromName: donor.name, fromProcess: donor.process, to: receiver.id, toName: receiver.name, toProcess: receiver.process, count });
    donor.available -= count;
    receiver.need -= count;
    if (donor.available === 0) donorIndex++;
    if (receiver.need === 0) receiverIndex++;
  }
  return result;
}

function renderNav() {
  const badge = getRecommendations().length;
  nav.innerHTML = NAV_ITEMS.map((item, index) => `
    <button class="nav-button ${state.activeView === item.id ? "active" : ""}" data-view="${item.id}" aria-current="${state.activeView === item.id ? "page" : "false"}">
      <span class="nav-index">${String(index + 1).padStart(2, "0")}</span>

}

function setLiveLabel() {

  if (el) el.innerHTML = `<i></i> 数据更新 ${state.lastUpdated}`;
}

function statusMarkup(diff) {
  if (diff < 0) return `<span class="status-badge shortage">缺口 ${Math.abs(diff)} 人</span>`;
  if (diff > 0) return `<span class="status-badge surplus">富余 ${diff} 人</span>`;
  return `<span class="status-badge balanced">人力平衡</span>`;
}

function sourceMarkup(project) {
  return project.customerForecast !== null
    ? `<span class="source-badge customer">客户预报</span>`
    : `<span class="source-badge model">历史推算</span>`;
}

function contextBar(heading, description, actions = "") {
  return `<div class="context-bar">
    <div class="context-copy"><h2>${heading}</h2><p>${description}</p></div>
    <div class="context-actions">${actions}</div>
  </div>`;
}

function dateAndShiftControls(extra = "") {
  return `
    <label class="sr-only" for="planDate">计划日期</label>
    <input class="control" id="planDate" type="date" value="${state.planDate}">
    <div class="segmented" aria-label="班次筛选">
      ${[["all","全天"],["early","早班"],["middle","中班"],["late","晚班"]].map(([id,label]) => `<button class="segment ${state.shift === id ? "active" : ""}" data-shift="${id}">${label}</button>`).join("")}
    </div>${extra}`;
}

function kpiCard(label, icon, value, unit, foot, alert = false) {
  return `<article class="kpi-card ${alert ? "alert" : ""}">
    <div class="kpi-label"><span>${label}</span><span class="mini-icon">${icon}</span></div>
    <div class="kpi-value">${value}<small>${unit}</small></div>
    <div class="kpi-foot">${foot}</div>
  </article>`;
}

function projectTableRows() {
  return state.projects.map(project => {
    const needed = demand(project);
    const diff = balance(project);
    return `<tr>
      <td><div class="project-cell"><span class="project-code">${project.id}</span><span class="project-name"><strong>${project.name}</strong><small>${project.process}</small></span></div></td>
      <td>${sourceMarkup(project)}</td>
      <td>${fmt(planVolume(project))}</td>
      <td>${fmt(project.efficiency, 1)} <span class="formula-mini">件/时</span></td>
      <td class="number-strong">${needed}</td>
      <td>${project.scheduled}</td>
      <td>${statusMarkup(diff)}</td>
    </tr>`;
  }).join("");
}

function recommendationPanel() {
  const recs = getRecommendations();
  const m = metrics();
  const savedCost = (m.overtime - m.optimizedOvertime) * 48;
  return `<section class="panel recommendation-panel">
    <div class="panel-header"><div><h3>智能调配建议</h3><p>优先匹配同班次、可替代技能</p></div><span class="demo-tag">DEMO</span></div>
    <div class="reco-summary">
      <div class="reco-stat"><small>可内部调配</small><strong>${Math.min(m.shortage, m.surplus)} 人</strong></div>
      <div class="reco-stat"><small>预计节省加班费</small><strong>¥${fmt(savedCost)}</strong></div>
    </div>
    <div class="reco-list">
      ${recs.length ? recs.slice(0, 3).map(rec => `<div class="reco-item">
        <div class="reco-item-top"><span class="reco-node"><b>${rec.from}</b>${rec.fromName}</span><span class="reco-arrow"></span><span class="reco-node"><b>${rec.to}</b>${rec.toName}</span></div>
        <p>建议调配 <strong>${rec.count} 人</strong>，可消化 ${rec.toProcess} 当日缺口</p>
      </div>`).join("") : `<div class="reco-empty"><b>园区人力已平衡</b>当前无需跨项目调配</div>`}
    </div>
    <div class="reco-actions">
      <button class="button primary" data-action="apply-all" ${recs.length ? "" : "disabled"}>采用全部建议</button>
      <button class="button ghost" data-view="recommendations">查看详情</button>
    </div>
  </section>`;
}

function renderOverview() {
  const m = metrics();

    <div class="kpi-grid">
      ${kpiCard("计划处理货量", "量", fmt(m.totalVolume), "件", `客户预报覆盖 <strong>${coverage}%</strong>`)}
      ${kpiCard("测算需求人力", "需", fmt(m.totalDemand), "人", `基于效率与 <strong>8h</strong> 班次`)}
      ${kpiCard("实际已排人力", "排", fmt(m.totalScheduled), "人", `园区净差 <span class="${m.totalScheduled - m.totalDemand < 0 ? "warn" : ""}">${m.totalScheduled - m.totalDemand} 人</span>`)}

function healthRow(label, percent) {
  return `<div class="health-row"><span>${label}</span><strong>${percent}%</strong></div><div class="progress-track"><i style="width:${percent}%"></i></div>`;
}

function sparkline(values) {
  const width = 108, height = 34, pad = 3;
  const min = Math.min(...values), max = Math.max(...values), range = max - min || 1;
  const points = values.map((v, i) => `${pad + i * ((width - pad * 2) / (values.length - 1))},${height - pad - ((v - min) / range) * (height - pad * 2)}`);
  const area = `M ${points[0]} L ${points.slice(1).join(" L ")} L ${width-pad},${height-pad} L ${pad},${height-pad} Z`;
  return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" aria-label="近7日货量趋势"><path class="area" d="${area}"></path><path class="line" d="M ${points.join(" L ")}"></path></svg>`;
}

    <div class="mini-kpis" style="margin-top:16px">

      <div class="mini-card"><small>预测货量合计</small><strong>${fmt(metrics().totalVolume)}</strong><span>计划取值口径</span></div>
    </div>
    <div class="forecast-layout">
      <section class="panel">
        <div class="panel-header"><div><h3>项目货量预测</h3><p>修改客户预报后，计划货量和需求人力将同步重算</p></div><span class="demo-tag">演示数据</span></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>项目 / 流程</th><th>近 7 日趋势</th><th>客户预报</th><th>系统预测</th><th>最终计划</th><th>取值来源</th></tr></thead>
          <tbody>${state.projects.map(p => `<tr>
            <td><div class="project-cell"><span class="project-code">${p.id}</span><span class="project-name"><strong>${p.name}</strong><small>${p.process}</small></span></div></td>
            <td>${sparkline(p.history)}</td>
            <td><input class="forecast-input" type="number" min="0" step="10" value="${p.customerForecast ?? ""}" placeholder="未提供" data-customer-forecast="${p.id}" aria-label="${p.name}客户预报"></td>
            <td>${fmt(p.systemForecast)}</td>
            <td class="number-strong">${fmt(planVolume(p))}</td>
            <td>${sourceMarkup(p)}</td>
          </tr>`).join("")}</tbody>
        </table></div>

function showToast(message) {
  clearTimeout(toastTimer);
  toastEl.textContent = message;
  toastEl.classList.add("show");
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

function nowTime() {
  return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
}

function updateProject(id, updater) {
  const project = state.projects.find(p => p.id === id);
  if (!project) return;
  updater(project);
  saveState();
}

function applyTransfer(fromId, toId, count) {
  const from = state.projects.find(p => p.id === fromId);
  const to = state.projects.find(p => p.id === toId);
  if (!from || !to || count <= 0) return;
  const safeCount = Math.min(count, Math.max(0, balance(from)), Math.max(0, -balance(to)));
  if (!safeCount) return;
  from.scheduled -= safeCount;
  to.scheduled += safeCount;
  saveState();
}

document.addEventListener("click", event => {
  const viewButton = event.target.closest("[data-view]");
  if (viewButton) {
    state.activeView = viewButton.dataset.view;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  const shiftButton = event.target.closest("[data-shift]");
  if (shiftButton) {
    state.shift = shiftButton.dataset.shift;
    saveState();
    render();
    return;
  }

  const stepButton = event.target.closest("[data-step-staff]");
  if (stepButton) {
    const delta = Number(stepButton.dataset.delta);
    updateProject(stepButton.dataset.stepStaff, p => { p.scheduled = Math.max(0, p.scheduled + delta); });
    render();
    return;
  }

  const oneButton = event.target.closest("[data-apply-one]");
  if (oneButton) {
    applyTransfer(oneButton.dataset.from, oneButton.dataset.to, Number(oneButton.dataset.count));
    render();
    showToast("该条调配建议已计入实际排班");
    return;
  }

  const fileButton = event.target.closest("[data-open-file]");
  if (fileButton) {
    document.getElementById(`file-${fileButton.dataset.openFile}`)?.click();
    return;
  }

  const actionButton = event.target.closest("[data-action]");
  if (!actionButton) return;
  const action = actionButton.dataset.action;

  if (action === "apply-all") {
    const recs = getRecommendations();
    recs.forEach(rec => applyTransfer(rec.from, rec.to, rec.count));
    render();
    showToast(recs.length ? "全部建议已采用，排班与加班预测已更新" : "当前没有需要执行的调配建议");
  }

  if (action === "sync" || action === "sync-all") {
    state.lastUpdated = nowTime();
    state.sourceUpdates = { customer: `今日 ${state.lastUpdated}`, lms: `今日 ${state.lastUpdated}`, roster: `今日 ${state.lastUpdated}` };
    saveState();
    render();
    showToast("客户预报、LMS 与排班数据已同步");
  }

  if (action === "generate") {
    state.generated = true;
    render();
    showToast(`已生成 ${getRecommendations().length} 条跨项目调配路径`);
  }

  if (action === "recalculate-forecast") {
    state.projects.forEach(p => {
      const h = p.history;
      const raw = h[h.length - 1] * .5 + h[h.length - 2] * .3 + h[h.length - 3] * .2;
      p.systemForecast = Math.round(raw / 10) * 10;
    });
    state.lastUpdated = nowTime();
    saveState();
    render();
    showToast("系统预测与人力需求已按最新历史数据更新");
  }

  if (action === "reset-demo") {
    state.projects = structuredClone(DEFAULT_PROJECTS);
    saveState();
    render();
    showToast("演示排班已恢复为初始状态");
  }

  if (action === "history-refresh") {
    showToast("复盘指标已更新至最新数据周期");
  }
});

document.addEventListener("change", event => {
  if (event.target.id === "planDate") {
    state.planDate = event.target.value;
    saveState();
    showToast(`计划日期已切换至 ${state.planDate}`);
    return;
  }

  if (event.target.matches("[data-staff-input]")) {
    const value = Math.max(0, Math.min(200, Number(event.target.value) || 0));
    updateProject(event.target.dataset.staffInput, p => { p.scheduled = value; });
    render();
    return;
  }

  if (event.target.matches("[data-customer-forecast]")) {
    const raw = event.target.value.trim();
    updateProject(event.target.dataset.customerForecast, p => { p.customerForecast = raw === "" ? null : Math.max(0, Number(raw) || 0); });
    render();
    showToast(raw === "" ? "已切换为历史货量推算" : "客户预报已更新，计划人力已重新计算");
    return;
  }

  if (event.target.matches("[data-file-source]")) {
    const file = event.target.files?.[0];
    if (!file) return;
    const key = event.target.dataset.fileSource;
    state.sourceUpdates[key] = `今日 ${nowTime()}`;
    state.lastUpdated = nowTime();
    saveState();
    render();
    showToast(`${file.name} 已载入演示数据队列`);
  }
});

  if (!context?.registerTool) return;

  const projectIds = state.projects.map(p => p.id);

    catch (error) { reportError(error); }
  };

  register({
    name: "read_daily_staffing_overview",
    title: "读取当日人力总览",
    description: "读取当前日期各项目的计划货量、需求人力、实际排班、缺口和园区调配空间。",
    inputSchema: { type: "object", properties: {}, additionalProperties: false },
    annotations: { readOnlyHint: true, untrustedContentHint: false },
    execute() {
      return {
        date: state.planDate,
        shift: state.shift,
        totals: metrics(),
        projects: state.projects.map(p => ({ id: p.id, name: p.name, planVolume: planVolume(p), demand: demand(p), scheduled: p.scheduled, balance: balance(p) }))

  register({
    name: "update_actual_staffing",
    title: "更新实际排班",
    description: "为一个项目登记实际排班人数，并立即重算项目缺口和园区调配建议。",
    inputSchema: {
      type: "object",
      properties: {
        projectId: { type: "string", enum: projectIds },
        people: { type: "integer", minimum: 0, maximum: 200 }
      },
      required: ["projectId", "people"],
      additionalProperties: false
    },
    annotations: { readOnlyHint: false, untrustedContentHint: false },
    execute(input) {
      if (!input || !projectIds.includes(input.projectId) || !Number.isInteger(input.people) || input.people < 0 || input.people > 200) throw new Error("Invalid staffing update");
      updateProject(input.projectId, p => { p.scheduled = input.people; });
      render();
      const project = state.projects.find(p => p.id === input.projectId);
      return { projectId: project.id, scheduled: project.scheduled, demand: demand(project), balance: balance(project), recommendationCount: getRecommendations().length };
    }
  });

  register({
    name: "set_customer_forecast",
    title: "录入客户货量预报",
    description: "录入或清空单个项目的客户货量预报，并立即更新最终计划货量与需求人力。",
    inputSchema: {
      type: "object",
      properties: {
        projectId: { type: "string", enum: projectIds },
        volume: { type: ["integer", "null"], minimum: 0, maximum: 1000000 }
      },
      required: ["projectId", "volume"],
      additionalProperties: false
    },
    annotations: { readOnlyHint: false, untrustedContentHint: false },
    execute(input) {
      if (!input || !projectIds.includes(input.projectId) || !(input.volume === null || (Number.isInteger(input.volume) && input.volume >= 0 && input.volume <= 1000000))) throw new Error("Invalid forecast update");
      updateProject(input.projectId, p => { p.customerForecast = input.volume; });
      render();
      const project = state.projects.find(p => p.id === input.projectId);
      return { projectId: project.id, planVolume: planVolume(project), source: project.customerForecast === null ? "historical_forecast" : "customer_forecast", demand: demand(project) };
    }
  });

  register({
    name: "apply_all_staffing_recommendations",
    title: "采用全部人力调配建议",
    description: "采用当前所有跨项目人力调配建议，更新实际排班并返回优化后的加班预测。",
    inputSchema: { type: "object", properties: {}, additionalProperties: false },
    annotations: { readOnlyHint: false, untrustedContentHint: false },
    execute() {
      const recs = getRecommendations();
      recs.forEach(rec => applyTransfer(rec.from, rec.to, rec.count));
      render();
      return { applied: recs.length, transfers: recs.map(r => ({ from: r.from, to: r.to, people: r.count })), totals: metrics() };
    }
  });
}

registerAgentTools();

</script>
</body>
</html>
